# Render Blueprint for NeuroNLP Nexus — one Web Service that builds the
# React frontend, then serves it from the same FastAPI process that
# serves /api (see backend/app/main.py's frontend-serving block). This
# keeps everything same-origin, so no CORS or second static-site
# service is needed for the deployed app.
#
# To use: push this repo to GitHub, then in the Render dashboard choose
# "New +" -> "Blueprint" and point it at the repo. Render reads this
# file automatically.
services:
  - type: web
    name: neuronlp-nexus
    env: python
    plan: free
    buildCommand: >-
      cd frontend && npm ci && npm run build &&
      cd ../backend && pip install -r requirements.txt &&
      python -m spacy download en_core_web_sm
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Signs every login session and email-verification link. Render
      # generates a real random value for this the first time it
      # deploys — never a hardcoded/shared secret.
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./nlp_nexus.db
      # No real SMTP credentials are configured here (this is a public
      # demo deploy, not production), so registration would otherwise
      # tell new users to "check your email" for a verification link
      # that never arrives. Turning this off keeps new accounts usable
      # immediately — matching this project's own honest
      # email_status: "not_configured" fallback behavior either way.
      #
      # Production-Ready Email Verification milestone (2026-10-28): the
      # real verification GATE in the code is restored and working (see
      # auth_service.register_user/login_user) and tested locally end to
      # end. This stays "false" here ONLY because no real email-sending
      # credentials exist for this deploy yet -- flipping it to "true"
      # without also filling in SENDGRID_API_KEY/SMTP_FROM_EMAIL below
      # would lock every new signup out with no way to ever receive the
      # link. Once SendGrid is actually configured and confirmed
      # delivering (see this project's deployment notes), change this to
      # "true" to turn the real gate on in production too.
      #
      # NOTE: this value is only read by the SERVICE CODE's own default
      # (os.getenv(..., "true")) when the var is truly unset -- Render's
      # Blueprint sync does not overwrite a var that already exists in
      # the live dashboard from an earlier deploy. If this key is
      # missing from the dashboard's Environment tab, add it there
      # explicitly rather than assuming this file's value is in effect.
      - key: EMAIL_VERIFICATION_ENABLED
        value: "false"
      # Where the "Verify Email / Activate Account" link in the welcome
      # email points — the frontend origin serving /verify-email (this
      # same Web Service's own public URL, since frontend+backend are one
      # service here), never localhost. Render fills RENDER_EXTERNAL_URL
      # in automatically; set this to that same value once the service
      # has its real onrender.com URL (or a custom domain), e.g.
      # https://neuronlp-nexus.onrender.com -- sync: false so it's set
      # once in the dashboard rather than committed here.
      - key: FRONTEND_BASE_URL
        sync: false
      # Shown in the verification/welcome email's security note. Optional
      # — falls back to a generic "your platform administrator" if unset.
      - key: SUPPORT_EMAIL
        sync: false
      # Real email delivery via SendGrid's HTTP API (see
      # backend/app/services/email_service.py). Render's free web
      # service tier blocks outbound traffic to SMTP ports 25/465/587
      # (see Render's own changelog: "free-web-services-will-no-longer
      # -allow-outbound-traffic-to-smtp-ports"), so this project sends
      # over plain HTTPS via SendGrid instead of smtplib. sync: false
      # means Render will ask for a value in the dashboard rather than
      # storing it in this committed file — never put a real credential
      # directly in render.yaml. SENDGRID_API_KEY is a Mail Send-scoped
      # API key from a verified Single Sender (no custom domain
      # required). SMTP_FROM_EMAIL/SMTP_FROM_NAME are kept from this
      # project's original SMTP design as the "from" identity — still
      # just "the address/name mail appears to come from," even though
      # sending no longer goes over SMTP.
      - key: SENDGRID_API_KEY
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: "NeuroNLP Nexus"
